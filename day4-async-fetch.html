<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 4 - Async & Fetch API</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    padding-top: 40px;
}

.container {
    background: white;
    padding: 20px;
    width: 400px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input {
    width: 80%;
    padding: 10px;
    margin: 10px 0;
}

button {
    padding: 10px 20px;
    cursor: pointer;
}

img {
    width: 120px;
    border-radius: 50%;
    margin-top: 10px;
}

#profile {
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
    <h1>GitHub Profile Fetcher</h1>

    <input
        type="text"
        id="username"
        placeholder="Enter GitHub Username"
    >

    <button onclick="getProfile()">
        Search
    </button>

    <p id="loading"></p>

    <div id="profile"></div>
</div>

<script>

// ==========================================
// 1. Promise Example
// ==========================================

function serverDelayPromise() {
    return new Promise((resolve) => {
        setTimeout(() => {
            resolve("Promise resolved after 2 seconds");
        }, 2000);
    });
}

serverDelayPromise().then((message) => {
    console.log(message);
});


// ==========================================
// 2. Async/Await Example
// ==========================================

async function serverDelayAsync() {
    const result = await serverDelayPromise();
    console.log("Async/Await:", result);
}

serverDelayAsync();


// ==========================================
// 3. GitHub Profile Fetcher
// ==========================================

async function getProfile() {

    const username = document.getElementById("username").value.trim();
    const loading = document.getElementById("loading");
    const profile = document.getElementById("profile");

    profile.innerHTML = "";

    if (username === "") {
        profile.innerHTML = "<p>Please enter a username.</p>";
        return;
    }

    loading.textContent = "Loading...";

    try {

        const response = await fetch(
            `https://api.github.com/users/${username}`
        );

        if (!response.ok) {
            throw new Error("User not found");
        }

        const data = await response.json();

        loading.textContent = "";

        profile.innerHTML = `
            <img src="${data.avatar_url}" alt="Avatar">
            <h2>${data.name || "No Name Available"}</h2>
            <p>${data.bio || "No Bio Available"}</p>
            <p><strong>Public Repositories:</strong> ${data.public_repos}</p>
            <a href="${data.html_url}" target="_blank">
                Visit GitHub Profile
            </a>
        `;

    } catch (error) {

        loading.textContent = "";

        profile.innerHTML = `
            <p style="color:red;">
                User not found!
            </p>
        `;
    }
}

</script>

</body>
</html>
